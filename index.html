<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة الإجازات — الديار العراقية للاستثمار</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
  :root{
    --ink:#152633; --paper:#f4f7fa; --line:#dbe4ec; --card:#ffffff;
    --blue:#1773b6; --blue-d:#125a8f; --blue-l:#eaf3fa;
    --teal:#5ac0ce; --gold:#f4c521; --red:#d83b32; --coral:#e78168;
  }
  :root{color-scheme:light}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
  .wrap{max-width:800px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:1.25rem;margin:0 0 2px;font-weight:800;color:var(--blue-d)}
  h2{font-weight:700}
  .sub{color:var(--blue);opacity:.85;margin:0 0 20px;font-size:.88rem}
  .brand{display:flex;align-items:center;gap:12px;padding:14px 4px 22px;border-bottom:3px solid var(--blue);
    margin-bottom:18px}
  .brand img{height:54px;width:auto;display:block}
  .brand .bt{line-height:1.3}
  .brand .bt b{display:block;color:var(--blue-d);font-size:1.05rem;font-weight:800}
  .brand .bt span{display:block;color:var(--ink);opacity:.6;font-size:.78rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;
    box-shadow:0 1px 3px rgba(23,115,182,.06)}
  label{display:block;font-size:.85rem;margin:10px 0 4px;opacity:.8;font-weight:500}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--paper);color:var(--ink);font-size:.95rem;font-family:inherit}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
  button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;
    font-size:.9rem;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit}
  button:hover{background:var(--blue-d)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
  button.reject{background:var(--red)}
  table{width:100%;border-collapse:collapse;font-size:.85rem;overflow-x:auto;display:block}
  th{text-align:right;padding:8px 10px;color:var(--blue-d);font-weight:700;border-bottom:2px solid var(--line)}
  td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  .badge{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700}
  .b-pending{background:#fbeec0;color:#8a6a10}
  .b-approved{background:#d3eff2;color:#136b78}
  .b-rejected{background:#f8d9d6;color:#a4241b}
  .balgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .balitem{background:var(--blue-l);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .balitem b{display:block;font-size:1.4rem;color:var(--blue-d)}
  .tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tabs button{margin-top:0;background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
  .tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .msg{font-size:.85rem;margin-top:8px}
  .msg.err{color:var(--red)} .msg.ok{color:var(--teal)}
  a.link-btn{color:var(--blue);font-size:.85rem;cursor:pointer;font-weight:500}
  .login-wrap{max-width:380px;margin:8vh auto 0;text-align:center}
  .login-wrap img{height:108px;margin-bottom:6px}
  .login-wrap .card{text-align:right}
  .watermark{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
  .watermark img{position:absolute;bottom:-60px;left:-60px;width:420px;opacity:.05;transform:rotate(-8deg)}
  .header-band{background:linear-gradient(135deg,var(--blue) 0%,var(--teal) 130%);
    border-radius:0 0 26px 26px;padding:20px 16px 26px;margin:0 -16px 20px;color:#fff;position:relative;z-index:1}
  .header-band .inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
  .header-band img.logo{height:42px;border-radius:8px;background:#fff;padding:3px;display:block}
  .header-band .bt b{color:#fff;font-size:1rem} .header-band .bt span{color:rgba(255,255,255,.85);font-size:.75rem}
  .header-band h1{color:#fff;font-size:1.2rem;margin:0 0 2px}
  .header-band .sub2{color:rgba(255,255,255,.85);font-size:.85rem;margin:0}
  .theme-toggle{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);color:#fff;
    border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer;margin:0}
  .header-band a.link-btn{color:#fff;opacity:.9}
  .card.accent-blue{border-inline-end:4px solid var(--blue)}
  .card.accent-teal{border-inline-end:4px solid var(--teal)}
  .card.accent-gold{border-inline-end:4px solid var(--gold)}
  .card.accent-red{border-inline-end:4px solid var(--red)}
  .profile-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .avatar-wrap{position:relative;flex-shrink:0}
  .avatar-img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid var(--blue);display:block}
  .avatar-fallback{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:800}
  .avatar-edit{position:absolute;bottom:-2px;left:-2px;background:var(--blue-d);color:#fff;border-radius:50%;
    width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer;border:2px solid var(--card)}
  .profile-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 16px;font-size:.82rem;flex:1;min-width:220px}
  .profile-meta span{opacity:.6;display:block}
  .profile-meta b{display:block;font-size:.95rem}
  footer.credit{text-align:center;padding:16px 10px;font-size:.72rem;opacity:.55;position:relative;z-index:1}
  .notice-panel{background:#eaf7ee;border:1px solid #bfe6cc;border-radius:14px;padding:14px 16px;margin-top:14px}
  .notice-panel h3{margin:0 0 10px;font-size:.88rem;color:#1f6b3a}
  .notice-item{padding:8px 0;border-bottom:1px dashed #bfe6cc}
  .notice-item:last-child{border-bottom:0}
  .notice-item p{margin:0 0 4px;font-size:.86rem;white-space:pre-wrap}
  .notice-item .meta{font-size:.72rem;opacity:.65}
  .notice-empty{font-size:.82rem;opacity:.6}
  .report-table{width:100%;border-collapse:collapse;font-size:.82rem}
  .report-table th,.report-table td{border:1px solid var(--line);padding:6px 8px;text-align:right}
  #printArea{display:none}
  @media print{
    body > *:not(#printArea){display:none !important}
    #printArea{display:block !important;position:static;margin:0;padding:16px}
  }
</style>

<script>

const SUPABASE_URL = "https://dhphajkvxesgmyoscwdp.supabase.co";

let sb = null;

const app = document.getElementById('app');
function showFatal(msg){
  let b = document.getElementById('fatalBanner');
  if(!b){
    b = document.createElement('div');
    b.id = 'fatalBanner';
    b.style.cssText = 'position:fixed;top:0;insetInline:0;left:0;right:0;background:#d83b32;color:#fff;padding:10px 14px;font-size:.85rem;z-index:9999;text-align:center';
    document.body.prepend(b);
  }
  b.textContent = (lang==='en' ? 'An error occurred: ' : 'حدث خطأ: ') + msg + (lang==='en' ? ' — please reload the page.' : ' — الرجاء إعادة تحميل الصفحة.');
}

let session = JSON.parse(sessionStorage.getItem('leave_session') || 'null');
let tab = 'home';
let editingEmpId = null;

async function setSession(emp){
  session = emp; sessionStorage.setItem('leave_session', JSON.stringify(emp));
  await accrueSelf();
  subscribeAnnouncements();
  subscribeOwnProfileUpdates();
  render();
}
async function accrueOne(empId, hireDate, lastAccrual, types){
  if(!types || !types.length) return;
  const now = new Date();
  let [fy,fm,fd] = (lastAccrual || hireDate).split('-').map(Number);
  let resetToZero = false;
  // الرصيد الاعتيادي يُصفَّر كل بداية سنة ولا يتراكم عبر السنوات — إن كان آخر تحديث من سنة سابقة،
  // نبدأ الحساب من أول هذه السنة (أو من تاريخ التعيين إن كان التعيين خلال هذه السنة)
  if(fy < now.getFullYear()){
    resetToZero = true;
    const [hy,hm,hd] = hireDate.split('-').map(Number);
    if(hy === now.getFullYear()){ fy=hy; fm=hm; fd=hd; }
    else { fy = now.getFullYear(); fm = 1; fd = 1; }
  }
  let months = (now.getFullYear()-fy)*12 + (now.getMonth()-(fm-1));
  if(now.getDate() < fd) months--;
  if(months < 0) months = 0;
  if(months <= 0 && !resetToZero) return;
  for(const ty of types){
    // Sick leave is a manually controlled entitlement in this system; never let
    // the monthly accrual engine overwrite a balance set by HR/Admin.
    if(isSickLeaveType(ty)) continue;
    const add = months * Number(ty.accrual_per_month);
    const {data: bal} = await sb.from('leave_balances').select('*').eq('employee_id',empId).eq('leave_type_id',ty.id).maybeSingle();
    const base = resetToZero ? 0 : Number(bal ? bal.balance : 0);
    const newBal = base + add;
    if(bal) await sb.from('leave_balances').update({balance:newBal, updated_at:new Date().toISOString()}).eq('id',bal.id);
    else await sb.from('leave_balances').insert({employee_id:empId, leave_type_id:ty.id, balance:newBal});
  }
  const tot = (fm-1)+months, y2 = fy+Math.floor(tot/12), m2 = (tot%12)+1;
  const iso = y2+'-'+String(m2).padStart(2,'0')+'-'+String(Math.min(fd,28)).padStart(2,'0');
  await sb.from('employees').update({last_accrual: iso}).eq('id', empId);
}
async function accrueSelf(){
  try{
    const {data: emp} = await sb.from('employees').select('id,hire_date,last_accrual').eq('id', session.id).single();
    const {data: types} = await sb.from('leave_types').select('id,accrual_per_month').gt('accrual_per_month',0);
    if(!emp) return;
    await accrueOne(emp.id, emp.hire_date, emp.last_accrual, types);
  }catch(e){}
}
let accrueAllRanThisSession = false;
async function accrueAllActive(){
  // نسخة مُحسَّنة: بدل استعلام منفصل لكل موظف (مئات الاستعلامات لعشرات الموظفين، وهو
  // السبب الرئيسي لبطء فتح لوحة HR/admin)، نجلب كل شيء بثلاث استعلامات فقط ثم نرسل
  // كل التحديثات دفعة واحدة (upsert) بدل استعلام منفصل لكل موظف/نوع إجازة.
  if(accrueAllRanThisSession) return;
  accrueAllRanThisSession = true;
  try{
    const {data: emps} = await sb.from('employees').select('id,hire_date,last_accrual').eq('status','active');
    const {data: types} = await sb.from('leave_types').select('id,accrual_per_month').gt('accrual_per_month',0);
    if(!emps || !emps.length || !types || !types.length) return;
    const empIds = emps.map(e=>e.id);
    const {data: bals} = await sb.from('leave_balances').select('employee_id,leave_type_id,balance').in('employee_id', empIds);
    const bmap = {}; (bals||[]).forEach(b=>bmap[b.employee_id+'_'+b.leave_type_id]=b);
    const now = new Date();
    const balanceUpserts = [];
    const employeeUpserts = [];
    const activeTypes = types.filter(ty=>!isSickLeaveType(ty));
    for(const e of emps){
      let [fy,fm,fd] = (e.last_accrual || e.hire_date).split('-').map(Number);
      let resetToZero = false;
      if(fy < now.getFullYear()){
        resetToZero = true;
        const [hy,hm,hd] = e.hire_date.split('-').map(Number);
        if(hy === now.getFullYear()){ fy=hy; fm=hm; fd=hd; }
        else { fy = now.getFullYear(); fm = 1; fd = 1; }
      }
      let months = (now.getFullYear()-fy)*12 + (now.getMonth()-(fm-1));
      if(now.getDate() < fd) months--;
      if(months < 0) months = 0;
      if(months <= 0 && !resetToZero) continue;
      for(const ty of activeTypes){
        const add = months * Number(ty.accrual_per_month);
        const existing = bmap[e.id+'_'+ty.id];
        const base = resetToZero ? 0 : Number(existing ? existing.balance : 0);
        balanceUpserts.push({employee_id:e.id, leave_type_id:ty.id, balance: base+add, updated_at:new Date().toISOString()});
      }
      const tot = (fm-1)+months, y2 = fy+Math.floor(tot/12), m2 = (tot%12)+1;
      const iso = y2+'-'+String(m2).padStart(2,'0')+'-'+String(Math.min(fd,28)).padStart(2,'0');
      employeeUpserts.push({id:e.id, last_accrual:iso});
    }
    if(balanceUpserts.length) await sb.from('leave_balances').upsert(balanceUpserts, {onConflict:'employee_id,leave_type_id'});
    if(employeeUpserts.length) await sb.from('employees').upsert(employeeUpserts, {onConflict:'id'});
  }catch(e){}
}

let audioCtx = null;
function prepareNotifyAudio(){
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  }catch(e){}
}
function playNotifySound(){
  try{
    prepareNotifyAudio();
    if(!audioCtx || audioCtx.state === 'suspended') return;
    const now = audioCtx.currentTime;
    [880, 1175, 880].forEach((freq, i)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + i*0.16);
      gain.gain.exponentialRampToValueAtTime(0.25, now + i*0.16 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i*0.16 + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + i*0.16); osc.stop(now + i*0.16 + 0.3);
    });
  }catch(e){}
}

      .on('postgres_changes', {event:'INSERT', schema:'public', table:'leave_requests'}, async payload=>{
        const row = payload.new;
        if(!row || !session) return;

        // The substitute is notified first.
        if(row.status === 'pending_substitute'){
          if(row.substitute_id === session.id){
            playNotifySound();
            showToast(lang==='en' ? 'A colleague named you as substitute — approval needed' : 'زميل اختارك بديلاً له — بانتظار موافقتك');
            render();
          }
          return;
        }

        // New requests: notify only the manager who is actually assigned to the employee.
        if(row.status === 'pending_manager' && session.role === 'manager'){
          const {data: emp} = await sb.from('employees')
            .select('manager_id, manager_name, full_name')
            .eq('id', row.employee_id).maybeSingle();
          const isMine = emp && (emp.manager_id === session.id ||
            (emp.manager_name && emp.manager_name.trim() === (session.name||'').trim()));
          if(!isMine) return;
          playNotifySound();
          showToast(lang==='en' ? 'New leave request awaiting your approval' : 'طلب إجازة جديد بانتظار موافقتك');
          renderManager();
          return;
        }

        // A manager without a higher manager is routed to HR/System Admin.
        if(row.status === 'pending_hr' && (session.role === 'hr' || session.role === 'admin')){
          playNotifySound();
          showToast(lang==='en' ? 'Manager leave request needs processing' : 'طلب إجازة المدير يحتاج إلى معالجة');
          renderHR();
        }
      })
      .on('postgres_changes', {event:'UPDATE', schema:'public', table:'leave_requests'}, async payload=>{
        const row = payload.new;
        if(!row || !session) return;

        // Substitute approved -> manager (or HR) is notified now.
        if(row.status === 'pending_manager' && session.role === 'manager'){
          const {data: emp} = await sb.from('employees').select('manager_id, manager_name').eq('id', row.employee_id).maybeSingle();
          const isMine = emp && (emp.manager_id === session.id || (emp.manager_name && emp.manager_name.trim() === (session.name||'').trim()));

            showToast(lang==='en' ? 'New leave request awaiting your approval' : 'طلب إجازة جديد بانتظار موافقتك');

          }
          return;
        }
        if(row.status === 'pending_hr' && (session.role === 'hr' || session.role === 'admin')){
          playNotifySound();
          showToast(lang==='en' ? 'Manager leave request needs processing' : 'طلب إجازة المدير يحتاج إلى معالجة');
          renderHR();
          return;
        }

        // HR and System Admin are notified when a manager approves/rejects a request.
        if((session.role === 'hr' || session.role === 'admin') &&
           (row.status === 'approved' || row.status === 'rejected')){
          playNotifySound();

function setLang(l){
  // Accept only an explicit language. Never toggle based on the current state.
  const nextLang = l === 'en' ? 'en' : 'ar';
  lang = nextLang;
  try{ localStorage.setItem('leave_lang', nextLang); }catch(e){}

  const root = document.getElementById('htmlRoot');
  if(root){
    root.setAttribute('dir', nextLang === 'en' ? 'ltr' : 'rtl');
    root.setAttribute('lang', nextLang);
  }

  // Put the language in the URL as well. A full reload is intentional:
  // it cancels the old page execution and prevents any pending async render
  // from writing the previous language back into the DOM.
  const newHash = '#lang=' + nextLang;
  if(location.hash !== newHash){
    location.hash = newHash;
  }
  location.reload();
}

function tenureStr(hireDate){
  if(!hireDate) return '—';
  const start = new Date(hireDate);
  const now = new Date();
  let y = now.getFullYear() - start.getFullYear();
  let m = now.getMonth() - start.getMonth();
  let d = now.getDate() - start.getDate();
  if(d < 0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
  if(m < 0){ y--; m += 12; }
  return y + ' سنة، ' + m + ' شهر، ' + d + ' يوم';
}

function normDigits(s){
  return s.replace(/[\u0660-\u0669]/g, d=>String(d.charCodeAt(0)-0x660))
          .replace(/[\u06F0-\u06F9]/g, d=>String(d.charCodeAt(0)-0x6F0));
}
async function doLogin(){

  msg.textContent = '';
  if(!code || !pin){ msg.textContent = lang==='en' ? 'Enter employee ID and PIN' : 'أدخل الرقم الوظيفي والرمز'; return; }
  if(!sb){ msg.textContent = lang==='en' ? 'Could not connect to the database' : 'تعذّر تهيئة الاتصال بقاعدة البيانات'; return; }

    if(error){ msg.textContent = (lang==='en'?'Connection error: ':'خطأ اتصال: ') + error.message + (error.code ? ' ('+error.code+')' : ''); return; }
    if(!data){ msg.textContent = lang==='en' ? 'No active employee with this ID' : 'لا يوجد موظف نشط بهذا الرقم الوظيفي'; return; }

    <div class="inner">
      <div style="display:flex;align-items:center;gap:10px">
        <img class="logo" src="${LOGO_B64}" alt="Al-Diyar Al-Iraqiya">
        <div class="bt"><b>${lang==='en'?'Al-Diyar Al-Iraqiya':'الديار العراقية للاستثمار'}</b><span>${lang==='en'?'Leave Management System':'نظام إدارة الإجازات'}</span></div>
      </div>
      <div class="lang-switch" style="display:flex;gap:6px;justify-content:flex-end">
        <button class="theme-toggle" style="opacity:${lang==='ar'?'1':'.65'}" onclick="setLang('ar')">العربية</button>
        <button class="theme-toggle" style="opacity:${lang==='en'?'1':'.65'}" onclick="setLang('en')">English</button>
      </div>
    </div>
    <div class="inner" style="margin-top:16px;align-items:flex-end">
      <div><h1>${title}</h1><p class="sub2">${session.name} — ${roleLabel(session.role)}</p></div>
      <a class="link-btn" onclick="logout()">${t('logout')}</a>
    </div>
  </div>`;
}
function roleLabel(r){
  if(lang==='en') return r==='hr'?'HR':r==='manager'?'Manager':r==='admin'?'System Admin':'Employee';
  return r==='hr'?'HR':r==='manager'?'مدير':r==='admin'?'مسؤول النظام':'موظف';
}
function badge(s){
  if(s==='pending_substitute') return `<span class="badge b-pending">${lang==='en'?'Pending substitute':'بانتظار البديل'}</span>`;
  if(s==='pending_hr') return `<span class="badge b-pending">${lang==='en'?'Pending HR':'بانتظار HR'}</span>`;
  if(s==='approved') return `<span class="badge b-approved">${t('approved')}</span>`;
  if(s==='rejected') return `<span class="badge b-rejected">${t('rejected')}</span>`;
  return `<span class="badge b-pending">${t('pending')}</span>`;
}

async function changeOwnPin(){
  const g = id => normDigits(document.getElementById(id).value.trim());
  const cur=g('pn_cur'), nw=g('pn_new'), cf=g('pn_cf');
  const msg=document.getElementById('pn_msg'); msg.className='msg err';
  if(!/^\d{4}$/.test(nw)){ msg.textContent = lang==='en'?'New PIN must be 4 digits':'الرمز الجديد يجب أن يكون 4 أرقام'; return; }
  if(nw!==cf){ msg.textContent = lang==='en'?'Confirmation does not match':'تأكيد الرمز غير مطابق'; return; }
  const {data} = await sb.from('employees').select('pin').eq('id',session.id).single();
  if(!data || String(data.pin).trim()!==cur){ msg.textContent = lang==='en'?'Current PIN is incorrect':'الرمز الحالي غير صحيح'; return; }
  const {error} = await sb.from('employees').update({pin:nw}).eq('id',session.id);
  if(error){ msg.textContent = (lang==='en'?'Error: ':'خطأ: ')+error.message; return; }
  msg.className='msg ok'; msg.textContent = lang==='en'?'PIN updated':'تم تغيير الرمز السري';
  ['pn_cur','pn_new','pn_cf'].forEach(i=>document.getElementById(i).value='');
}
async function profileCard(){
  const {data: emp} = await sb.from('employees').select('*').eq('id', session.id).single();
  if(!emp) return '';
  let mgrName = emp.manager_name || '';
  if(!mgrName && emp.manager_id){
    const {data: mgr} = await sb.from('employees').select('full_name').eq('id', emp.manager_id).maybeSingle();
    if(mgr) mgrName = mgr.full_name;
  }
  const {count} = await sb.from('leave_requests').select('id',{count:'exact',head:true}).eq('employee_id', session.id);
  const avatarHtml = emp.photo_data
    ? `<img id="prof_photo" class="avatar-img" src="${emp.photo_data}">`
    : `<div class="avatar-fallback">${emp.full_name.charAt(0)}</div>`;

  const {data: notices} = await sb.from('announcements')
    .select('*').or('target_employee_id.is.null,target_employee_id.eq.'+session.id)
    .order('created_at',{ascending:false}).limit(5);
  const noticeItems = (notices||[]).map(n=>{
    const d = new Date(n.created_at);
    const stamp = d.toLocaleDateString('ar-IQ') + ' — ' + d.toLocaleTimeString('ar-IQ',{hour:'2-digit',minute:'2-digit'});
    return `<div class="notice-item"><p>${esc(n.message)}</p><div class="meta">${esc(n.created_by_name||'HR')} · ${stamp}${n.target_employee_id?(' · '+(lang==='en'?'Private note':'إشعار خاص')):''}</div></div>`;
  }).join('') || `<div class="notice-empty">${lang==='en'?'No announcements right now':'لا توجد إعلانات حالياً'}</div>`;
  const noticePanel = `<div class="notice-panel">
      <h3>📢 ${lang==='en'?'Announcements & Notices':'الإعلانات والإشعارات'}</h3>
      ${noticeItems}
    </div>`;

  return `<div class="card accent-blue profile-row">
      <div class="avatar-wrap">
        ${avatarHtml}
        <label class="avatar-edit" for="photo_input" title="تغيير الصورة">✎</label>
        <input type="file" id="photo_input" accept="image/*" style="display:none" onchange="uploadPhoto(event)">
      </div>
      <div style="min-width:160px">
        <div style="font-weight:800;font-size:1.05rem">${emp.full_name}</div>
        <div style="opacity:.7;font-size:.85rem">${emp.job_title || 'لم يُحدد المسمى الوظيفي'}</div>
        <div style="opacity:.55;font-size:.78rem;margin-top:2px">القسم: ${emp.department || '-'}</div>
      </div>
      <div class="profile-meta">
        <div><span>${t('hire_date')}</span><b>${emp.hire_date || '-'}</b></div>
        <div><span>${t('tenure')}</span><b>${tenureStr(emp.hire_date)}</b></div>
        <div><span>${t('manager')}</span><b>${mgrName || '—'}</b></div>
        <div><span>${t('req_count')}</span><b>${count || 0}</b></div>
      </div>
      ${noticePanel}
    </div>
    <div class="card accent-teal">
      <h2 style="font-size:1rem">${lang==='en'?'Change PIN':'تغيير الرمز السري'}</h2>
      <label>${lang==='en'?'Current PIN':'الرمز الحالي'}</label><input id="pn_cur" dir="ltr" type="password" inputmode="numeric" maxlength="4">
      <label>${lang==='en'?'New PIN (4 digits)':'الرمز الجديد (4 أرقام)'}</label><input id="pn_new" dir="ltr" type="password" inputmode="numeric" maxlength="4">
      <label>${lang==='en'?'Confirm New PIN':'تأكيد الرمز الجديد'}</label><input id="pn_cf" dir="ltr" type="password" inputmode="numeric" maxlength="4">
      <button onclick="changeOwnPin()">${lang==='en'?'Update PIN':'تحديث الرمز'}</button>
      <div id="pn_msg" class="msg"></div>
    </div>`;
}

async function leaveRequestPanel(){
  const {data: bals} = await sb.from('leave_balances').select('leave_type_id, balance, leave_types(name_ar,name_en,code,unlimited)').eq('employee_id', session.id);
  const {data: reqs} = await sb.from('leave_requests').select('*, leave_types(name_ar,name_en)').eq('employee_id', session.id).order('requested_at',{ascending:false});
  const {data: subCandidates} = await sb.from('employees').select('id, full_name').eq('status','active').neq('id', session.id).order('full_name');
  const subOptions = `<option value="">${lang==='en'?'— None —':'— بدون —'}</option>` +
    (subCandidates||[]).map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('');

  const tn = x => x ? (lang==='en' ? (x.name_en || x.name_ar) : x.name_ar) : '-';
  let balHtml = (bals||[]).map(b=>`<div class="balitem"><b>${b.leave_types && b.leave_types.unlimited ? '∞' : fmtBal(b.balance)}</b>${tn(b.leave_types)}</div>`).join('');
  // قائمة أنواع الإجازة المتاحة للطلب مبنية فقط على ما لدى الموظف فعلياً رصيد له
  // (يضمن تلقائياً استبعاد الأنواع الخاصة بجنس آخر أو الأنواع المُلغاة)
  let typeOptions = (bals||[]).map(b=>`<option value="${b.leave_type_id}">${tn(b.leave_types)}</option>`).join('');
  let reqRows = (reqs||[]).map(r=>`<tr><td>${tn(r.leave_types)}${subLine(r)}</td><td>${r.start_date}</td><td>${r.end_date}</td><td>${r.days_count}</td><td>${badge(r.status)}${r.substitute_note?`<div style="font-size:.72rem;opacity:.65;margin-top:2px">↪💬 ${esc(r.substitute_note)}</div>`:''}${r.manager_note?`<div style="font-size:.72rem;opacity:.65;margin-top:2px">💬 ${esc(r.manager_note)}</div>`:''}</td><td>${r.attachment_data ? `<a class="link-btn" href="${r.attachment_data}" download="${esc(r.attachment_name||'attachment')}" target="_blank">📎</a>` : '-'}</td></tr>`).join('') || `<tr><td colspan="6">${t('no_requests')}</td></tr>`;

  return `
    <div class="card"><h2 style="font-size:1rem">${t('leave_balance')}</h2><div class="balgrid">${balHtml}</div></div>
    <div class="card">
      <h2 style="font-size:1rem">${t('submit_request')}</h2>
      <label>${t('leave_type')}</label><select id="rq_type">${typeOptions}</select>
      <label>${t('from_date')}</label><input id="rq_start" type="date">
      <label>${t('to_date')}</label><input id="rq_end" type="date">
      <label>${t('reason')}</label><textarea id="rq_reason" rows="2"></textarea>
      <label>${lang==='en'?'Substitute employee (optional)':'الموظف البديل (اختياري)'}</label>
      <select id="rq_sub">${subOptions}</select>
      <label>${lang==='en'?'Supporting document (optional — e.g. medical note, marriage contract, death certificate)':'إثبات الإجازة (اختياري — مثل وصفة طبية، عقد زواج، شهادة وفاة)'}</label>
      <input type="file" id="rq_attachment" accept="image/*,.pdf">
      <button onclick="submitRequest()">${lang==='en'?'Submit':'إرسال الطلب'}</button>
      <div id="rq_msg" class="msg"></div>
    </div>
    <div class="card"><h2 style="font-size:1rem">${t('my_requests')}</h2>
      <table><tr><th>${t('type_col')}</th><th>${t('from_col')}</th><th>${t('to_col')}</th><th>${t('days_col')}</th><th>${t('status_col')}</th><th>${lang==='en'?'File':'المرفق'}</th></tr>${reqRows}</table>
    </div>`;

async function substitutePanel(){
  if(!session) return '';
  const {data: reqs, error} = await sb.from('leave_requests')
    .select('*, employees!leave_requests_employee_id_fkey(full_name, manager_id, manager_name), leave_types(name_ar,name_en)')
    .eq('status','pending_substitute').eq('substitute_id', session.id).order('requested_at',{ascending:true});
  if(error || !reqs || !reqs.length) return '';
  const pl = await photoLookup(reqs);
  const tn = x => x ? (lang==='en' ? (x.name_en || x.name_ar) : x.name_ar) : '-';
  const rows = reqs.map(r=>`<tr>
    <td>${requestPeople(r, pl)}</td><td>${tn(r.leave_types)}</td>
    <td>${r.start_date} → ${r.end_date}</td><td>${r.days_count}</td>
    <td style="min-width:150px"><textarea id="snote_${r.id}" rows="1" placeholder="${lang==='en'?'Comment (optional)':'تعليق (اختياري)'}" style="width:100%;font-size:.8rem;padding:6px"></textarea></td>
    <td style="white-space:nowrap"><button onclick="decideSub('${r.id}',true)">${lang==='en'?'Accept':'موافقة'}</button>
      <button class="reject" onclick="decideSub('${r.id}',false)">${lang==='en'?'Decline':'اعتذار'}</button></td></tr>`).join('');
  return `<div class="card accent-gold"><h2 style="font-size:1rem">${lang==='en'?'Requests naming you as substitute':'طلبات اختارتك بديلاً'}</h2>
    <p style="font-size:.8rem;opacity:.7">${lang==='en'?'Your approval is required before the request goes to the manager.':'موافقتك مطلوبة قبل انتقال الطلب إلى المدير.'}</p>
    <table><tr><th>${lang==='en'?'People':'الأشخاص'}</th><th>${t('type_col')}</th><th>${lang==='en'?'Period':'الفترة'}</th><th>${t('days_col')}</th><th>${lang==='en'?'Comment':'تعليق'}</th><th></th></tr>${rows}</table></div>`;
}
async function decideSub(reqId, ok){
  const noteEl = document.getElementById('snote_'+reqId);
  const note = noteEl ? noteEl.value.trim() : '';
  const {data: req} = await sb.from('leave_requests')
    .select('*, employees!leave_requests_employee_id_fkey(role, manager_id, manager_name)').eq('id',reqId).single();
  if(!req || req.status !== 'pending_substitute' || req.substitute_id !== session.id) return render();
  const e = req.employees || {};
  const hasHigher = !!(e.manager_id || (e.manager_name && e.manager_name.trim()));
  const next = (e.role === 'manager' && !hasHigher) ? 'pending_hr' : 'pending_manager';
  const upd = ok
    ? {status: next, substitute_note: note||null, substitute_decided_at: new Date().toISOString()}
    : {status: 'rejected', substitute_note: note||null, substitute_decided_at: new Date().toISOString(), decided_at: new Date().toISOString(), hr_notified:false};
  const {error} = await sb.from('leave_requests').update(upd).eq('id',reqId);
  if(error){ showToast((lang==='en'?'Error: ':'خطأ: ')+error.message); return; }
  render();
}

async function submitRequest(){
  const {data: myEmp, error: empErr} = await sb.from('employees').select('id, full_name, role, manager_id, manager_name, manager_email, manager_phone').eq('id', session.id).single();
  if(empErr) showFatal(empErr.message);
  const type_id = document.getElementById('rq_type').value;
  const start = document.getElementById('rq_start').value;
  const end = document.getElementById('rq_end').value;
  const reason = document.getElementById('rq_reason').value;
  const msg = document.getElementById('rq_msg'); msg.className='msg';
  if(!start || !end){ msg.textContent='حدد التواريخ'; msg.className='msg err'; return; }
  if(new Date(end) < new Date(start)){ msg.textContent='تاريخ النهاية قبل البداية'; msg.className='msg err'; return; }

  const {data: type} = await sb.from('leave_types').select('*').eq('id', type_id).single();
  const {data: holidays} = await sb.from('holidays').select('holiday_date');
  const holSet = new Set((holidays||[]).map(h=>h.holiday_date));

  let days = 0;
  let d = new Date(start);
  const endD = new Date(end);
  while(d <= endD){
    const iso = d.toISOString().slice(0,10);
    const isHoliday = holSet.has(iso);
    if(!(type.counts_holidays === false && isHoliday)) days++;
    d.setDate(d.getDate()+1);
  }

  const fileInput = document.getElementById('rq_attachment');
  const file = fileInput && fileInput.files[0];
  let attachment_data = null, attachment_name = null;
  if(file){
    if(file.size > 4*1024*1024){
      msg.textContent = lang==='en' ? 'Attachment must be under 4MB' : 'يجب أن يكون حجم المرفق أقل من 4 ميغابايت'; msg.className='msg err'; return;
    }
    attachment_data = await new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    attachment_name = file.name;
  }

  // A manager may also submit leave. If there is no higher manager, route the request to HR/System Admin.
  const hasHigherManager = !!(myEmp && (myEmp.manager_id || (myEmp.manager_name && myEmp.manager_name.trim())));
  const subSel = document.getElementById('rq_sub');
  const substituteId = subSel ? subSel.value : '';
  const nextAfterSub = (session.role === 'manager' && !hasHigherManager) ? 'pending_hr' : 'pending_manager';
  // عند اختيار بديل يذهب الطلب إليه أولاً، ثم المدير، ثم HR
  const requestStatus = substituteId ? 'pending_substitute' : nextAfterSub;
  const substituteName = substituteId ? subSel.selectedOptions[0].textContent : '';
  const payload = {
    employee_id: session.id, leave_type_id: type_id, start_date: start, end_date: end,
    days_count: days, reason, status:requestStatus, attachment_data, attachment_name,
    hr_notified: false
  };
  // نضيف حقول البديل فقط عند اختياره (يبقى التقديم يعمل حتى قبل تنفيذ تحديث قاعدة البيانات)
  if(substituteId){ payload.substitute_id = substituteId; payload.substitute_name = substituteName; }
  const {error} = await sb.from('leave_requests').insert(payload);
  if(error){ msg.textContent=(lang==='en'?'Error: ':'خطأ: ')+error.message; msg.className='msg err'; return; }
  const typeName = document.getElementById('rq_type').selectedOptions[0].textContent;
  let noteHtml = '';
  if(requestStatus === 'pending_substitute') {
    noteHtml += `<div style="margin-top:10px" class="msg ok">${lang==='en'
      ? 'Your request was sent to your substitute ('+esc(substituteName)+') for approval first, then it moves to your manager and HR.'
      : 'تم إرسال طلبك إلى البديل ('+esc(substituteName)+') للموافقة أولاً، ثم ينتقل إلى المدير ثم HR.'}</div>`;
  } else if(requestStatus === 'pending_hr') {
    noteHtml += `<div style="margin-top:10px" class="msg ok">${lang==='en'
      ? 'Your request was recorded and sent to HR/System Admin because no higher manager is assigned to you.'
      : 'تم تسجيل طلبك وإحالته إلى HR/مسؤول النظام لعدم وجود مدير أعلى مرتبط بك.'}</div>`;
  } else if(myEmp && myEmp.manager_email){
    const subjectRaw = 'طلب إجازة - ' + myEmp.full_name;
    const bodyRaw =
      'طلب إجازة جديد بانتظار موافقتكم\n\n' +
      'الموظف: ' + myEmp.full_name + '\n' +
      'المدير: ' + (myEmp.manager_name||'') + '\n' +
      'نوع الإجازة: ' + typeName + '\n' +
      'من: ' + start + '  إلى: ' + end + '\n' +
      'عدد الأيام: ' + days + '\n' +
      (substituteName ? ('الموظف البديل: ' + substituteName + '\n') : '') +
      (reason ? ('السبب: ' + reason + '\n') : '') +
      '\nالرجاء مراجعة الطلب والموافقة عليه من داخل النظام.';
    const to = encodeURIComponent(myEmp.manager_email);
    const subject = encodeURIComponent(subjectRaw);
    const body = encodeURIComponent(bodyRaw);
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${to}&su=${subject}&body=${body}`;
    const outlookUrl = `https://outlook.office.com/mail/deeplink/compose?to=${to}&subject=${subject}&body=${body}`;
    const mailtoUrl = 'mailto:' + myEmp.manager_email + '?subject=' + subject + '&body=' + body;
    noteHtml += `<div style="margin-top:10px">
      <div style="font-size:.78rem;opacity:.7;margin-bottom:6px">${lang==='en'?'Email your manager via:':'إرسال إشعار بالبريد لمديرك عبر:'}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <a class="link-btn" href="${gmailUrl}" target="_blank" style="display:inline-block">📧 Gmail</a>
        <a class="link-btn" href="${outlookUrl}" target="_blank" style="display:inline-block">📧 Outlook</a>
        <a class="link-btn" href="${mailtoUrl}" style="display:inline-block">✉️ ${lang==='en'?'Default mail app':'برنامج البريد الافتراضي'}</a>
      </div>
    </div>`;
  } else {
    noteHtml += `<div style="margin-top:8px;font-size:.78rem;opacity:.65">${lang==='en'
      ? 'No manager email is set for you — ask HR to add it to get an email-notify button.'
      : 'لا يوجد بريد إلكتروني مسجّل لمديرك — اطلب من HR إضافته حتى يظهر زر إشعار البريد.'}</div>`;
  }
  if(requestStatus !== 'pending_substitute' && whatsappEnabled()){
    if(myEmp && myEmp.manager_phone){
      const waText = encodeURIComponent(
        (lang==='en'?'New leave request awaiting your approval\n\n':'طلب إجازة جديد بانتظار موافقتكم\n\n') +
        (lang==='en'?'Employee: ':'الموظف: ') + myEmp.full_name + '\n' +
        (lang==='en'?'Type: ':'نوع الإجازة: ') + typeName + '\n' +
        (lang==='en'?'From: ':'من: ') + start + '  ' + (lang==='en'?'To: ':'إلى: ') + end + '\n' +
        (lang==='en'?'Days: ':'عدد الأيام: ') + days +
        (substituteName ? ('\n' + (lang==='en'?'Substitute: ':'الموظف البديل: ') + substituteName) : '')
      );
      const phoneDigits = myEmp.manager_phone.replace(/[^0-9]/g,'');
      const wa = 'https://wa.me/' + phoneDigits + '?text=' + waText;
      noteHtml += `<a class="link-btn" href="${wa}" target="_blank" style="display:block;margin-top:8px">🟢 ${lang==='en'?'Notify your manager on WhatsApp':'إرسال إشعار عبر واتساب لمديرك'}</a>`;
    } else {
      noteHtml += `<div style="margin-top:8px;font-size:.78rem;opacity:.65">${lang==='en'
        ? 'WhatsApp notify is on, but no manager phone number is set for you — ask HR to add it.'
        : 'خاصية واتساب مفعّلة، لكن لا يوجد رقم واتساب مسجّل لمديرك — اطلب من HR إضافته من ملفك.'}</div>`;
    }
  }
  const doneBtn = noteHtml
    ? `<button class="ghost" onclick="render()" style="margin-top:12px">✓ ${lang==='en'?'Done':'تم'}</button>`
    : '';
  msg.innerHTML = `${lang==='en'?'Submitted — days counted: ':'تم الإرسال — عدد الأيام المحتسبة: '}${days}<br>${noteHtml}${doneBtn}`; msg.className='msg ok';
  if(!noteHtml) setTimeout(render, 900);
}

function uploadPhoto(ev, targetId){
  targetId = targetId || session.id;
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = async function(){
      const maxDim = 220;
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; } }
      else { if(h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;

  };

}

async function decide(reqId, decision){

  const note = noteEl ? noteEl.value.trim() : '';
  const {data: req} = await sb.from('leave_requests').select('*').eq('id',reqId).single();

  await sb.from('leave_requests').update({status:decision, decided_at:new Date().toISOString(), hr_notified: decision==='approved', manager_note: note || null}).eq('id',reqId);
  if(decision === 'approved'){
    const {data: lt} = await sb.from('leave_types').select('unlimited').eq('id', req.leave_type_id).maybeSingle();
    if(!lt || !lt.unlimited){
      const {data: bal} = await sb.from('leave_balances').select('*').eq('employee_id',req.employee_id).eq('leave_type_id',req.leave_type_id).maybeSingle();
      if(bal){ await sb.from('leave_balances').update({balance: Number(bal.balance) - Number(req.days_count), updated_at:new Date().toISOString()}).eq('id',bal.id); }
    }
  }
  if(session.role === 'manager') renderManager();
  else renderHR();
}

async function recalcAnnualBalances(){
  const msg = document.getElementById('rc_msg'); msg.className='msg';
  const confirmText = lang==='en'
    ? 'This will overwrite the balance of every active employee for monthly-accruing leave types (like annual) with the correct year-to-date value. Continue?'
    : 'سيُستبدل رصيد كل موظف نشط لأنواع الإجازة المتراكمة شهرياً (كالاعتيادية) بالقيمة الصحيحة للسنة الحالية فقط. متابعة؟';
  if(!confirm(confirmText)) return;
  msg.textContent = lang==='en' ? 'Recalculating...' : 'جاري إعادة الاحتساب...';
  try{
    const {data: types} = await sb.from('leave_types').select('id,accrual_per_month').gt('accrual_per_month',0);
    const {data: emps} = await sb.from('employees').select('id,hire_date').eq('status','active');
    if(!types || !types.length || !emps) { msg.textContent = lang==='en'?'Nothing to do':'لا يوجد ما يُنفَّذ'; return; }
    const now = new Date();
    const jan1 = now.getFullYear()+'-01-01';
    let fixedCount = 0;
    for(const e of emps){
      const [hy,hm,hd] = e.hire_date.split('-').map(Number);
      let anchorY = now.getFullYear(), anchorM = 1, anchorD = 1;
      if(hy === now.getFullYear()){ anchorM = hm; anchorD = hd; }
      let months = (now.getFullYear()-anchorY)*12 + (now.getMonth()-(anchorM-1));
      if(now.getDate() < anchorD) months--;
      if(months < 0) months = 0;
      const anchorIso = (hy===now.getFullYear()?e.hire_date:jan1);
      for(const ty of types){
        const accrued = months * Number(ty.accrual_per_month);
        const {data: taken} = await sb.from('leave_requests').select('days_count')
          .eq('employee_id', e.id).eq('leave_type_id', ty.id).eq('status','approved')
          .gte('start_date', anchorIso);
        const used = (taken||[]).reduce((s,r)=>s+Number(r.days_count||0),0);
        const correct = accrued - used;
        const tot = (anchorM-1)+months, y2 = anchorY+Math.floor(tot/12), m2 = (tot%12)+1;
        const lastIso = y2+'-'+String(m2).padStart(2,'0')+'-'+String(Math.min(anchorD,28)).padStart(2,'0');
        const {data: bal} = await sb.from('leave_balances').select('id').eq('employee_id',e.id).eq('leave_type_id',ty.id).maybeSingle();
        if(bal) await sb.from('leave_balances').update({balance:correct, updated_at:new Date().toISOString()}).eq('id',bal.id);
        else await sb.from('leave_balances').insert({employee_id:e.id, leave_type_id:ty.id, balance:correct});
        await sb.from('employees').update({last_accrual:lastIso}).eq('id', e.id);
      }
      fixedCount++;
    }
    msg.className='msg ok';
    msg.textContent = lang==='en' ? `Recalculated for ${fixedCount} employee(s)` : `تم إعادة الاحتساب لـ${fixedCount} موظف`;
  }catch(e){
    msg.className='msg err'; msg.textContent = (lang==='en'?'Error: ':'خطأ: ')+(e.message||e);
  }
}
async function runYearEnd(){
  const typeId = document.getElementById('ry_type').value;
  const empId = document.getElementById('ry_emp').value;
  const action = document.getElementById('ry_action').value;
  const val = Number(document.getElementById('ry_val').value)||0;
  const msg = document.getElementById('ry_msg'); msg.className='msg';
  const empLabel = empId ? document.getElementById('ry_emp').selectedOptions[0].textContent : (lang==='en'?'all active employees':'جميع الموظفين النشطين');
  const confirmText = lang==='en'
    ? `This will change the balance of this leave type for ${empLabel}. Continue?`
    : `سيتم تغيير رصيد هذا النوع من الإجازة لـ${empLabel}. متابعة؟`;
  if(!confirm(confirmText)) return;
  msg.textContent = lang==='en' ? 'Applying...' : 'جاري التطبيق...';
  try{
    let empQuery = sb.from('employees').select('id').eq('status','active');
    if(empId) empQuery = empQuery.eq('id', empId);
    const {data: emps} = await empQuery;
    const {data: bals} = await sb.from('leave_balances').select('*').eq('leave_type_id', typeId);
    const bmap = {}; (bals||[]).forEach(b=>bmap[b.employee_id]=b);
    for(const e of (emps||[])){
      let newVal;
      if(action==='reset') newVal = 0;
      else if(action==='set') newVal = val;
      else newVal = Number(bmap[e.id] ? bmap[e.id].balance : 0) + val;
      if(bmap[e.id]) await sb.from('leave_balances').update({balance:newVal, updated_at:new Date().toISOString()}).eq('id', bmap[e.id].id);
      else await sb.from('leave_balances').insert({employee_id:e.id, leave_type_id:typeId, balance:newVal});
    }
    msg.className='msg ok';
    msg.textContent = lang==='en' ? `Applied to ${(emps||[]).length} employee(s)` : `تم التطبيق على ${(emps||[]).length} موظف`;
  }catch(e){
    msg.className='msg err'; msg.textContent = (lang==='en'?'Error: ':'خطأ: ')+(e.message||e);
  }
}

async function runReport(){
  const monthVal = document.getElementById('rp_month').value; // YYYY-MM
  if(!monthVal) return;
  reportMonth = monthVal;
  const [y,m] = monthVal.split('-').map(Number);
  const from = monthVal + '-01';
  const toD = new Date(y, m, 0).getDate();
  const to = monthVal + '-' + String(toD).padStart(2,'0');

  const {data: reqs} = await sb.from('leave_requests')
    .select('*, employees!leave_requests_employee_id_fkey(full_name, job_title), leave_types(name_ar,name_en,id)')
    .gte('requested_at', from + 'T00:00:00')
    .lte('requested_at', to + 'T23:59:59')
    .order('requested_at',{ascending:true});

  const rows = reqs || [];
  // current remaining balance per employee/type
  const empIds = [...new Set(rows.map(r=>r.employee_id))];

let xlsxLoadPromise = null;
function loadXlsxLib(){
  if(window.XLSX) return Promise.resolve();
  if(xlsxLoadPromise) return xlsxLoadPromise;
  xlsxLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return xlsxLoadPromise;
}
async function exportExcel(){
  if(!reportRows.length && !document.getElementById('rp_tablewrap').innerText.trim()) return;
  try{ await loadXlsxLib(); }catch(e){ showFatal(lang==='en'?'Could not load the Excel export library':'تعذّر تحميل مكتبة تصدير Excel'); return; }
  const headCols = lang==='en'
    ? ['Employee','Job Title','Type','From','To','Days','Remaining','Status']
    : ['الموظف','المسمى الوظيفي','النوع','من','إلى','الأيام','الرصيد المتبقي','الحالة'];
  const data = reportRows.map(r=>[r.name,r.title,r.type,r.from,r.to,r.days,r.remaining,r.status]);
  const ws = XLSX.utils.aoa_to_sheet([headCols, ...data]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Report');
  XLSX.writeFile(wb, 'leave-report-' + reportMonth + '.xlsx');
}

async function saveEdit(){
  const msg = document.getElementById('e_msg'); msg.className='msg err'; msg.textContent='';
  const pin = normDigits(document.getElementById('e_pin').value.trim());
  if(pin && !/^\d{4}$/.test(pin)){ msg.textContent = lang==='en' ? 'PIN must be 4 digits' : 'الرمز يجب أن يكون 4 أرقام'; return; }
  const payload = {
    full_name: document.getElementById('e_name').value.trim(),
    emp_code: document.getElementById('e_code').value.trim(),
    job_title: document.getElementById('e_title').value.trim(),
    department: document.getElementById('e_dept').value.trim(),
    hire_date: document.getElementById('e_hire').value,
    manager_id: document.getElementById('e_mgr').value || null,
    manager_name: document.getElementById('e_mgrname').value.trim() || null,
    manager_email: document.getElementById('e_mgremail').value.trim() || null,
    manager_phone: document.getElementById('e_mgrphone').value.trim() || null,
    email: document.getElementById('e_email').value.trim() || null,
    gender: document.getElementById('e_gender').value || null,
    role: document.getElementById('e_role').value,
    status: document.getElementById('e_status').value
  };
  if(pin) payload.pin = pin;
  if(!payload.full_name || !payload.emp_code || !payload.hire_date){ msg.textContent = lang==='en' ? 'Name, ID and hire date are required' : 'الاسم والرقم الوظيفي وتاريخ التعيين مطلوبة'; return; }
  const {error} = await sb.from('employees').update(payload).eq('id', editingEmpId);
  if(error){ msg.className='msg err'; msg.textContent = (lang==='en'?'Error: ':'خطأ: ')+error.message; return; }
  const {data: verify, error: vErr} = await sb.from('employees').select('manager_email, manager_phone').eq('id', editingEmpId).single();
  const {data: allTypes} = await sb.from('leave_types').select('*');
  const {data: bals} = await sb.from('leave_balances').select('*').eq('employee_id', editingEmpId);
  const bmap = {}; (bals||[]).forEach(b=>bmap[b.leave_type_id]=b);
  // حفظ قيم الحقول المعروضة فعلياً في النموذج فقط (تجنّباً لأي عدم تطابق مع فلترة الجنس)
  for(const ty of (allTypes||[])){
    const el = document.getElementById('bal_'+ty.id);
    if(!el) continue;
    const v = Number(el.value)||0;
    if(bmap[ty.id]) await sb.from('leave_balances').update({balance:v, updated_at:new Date().toISOString()}).eq('id',bmap[ty.id].id);
    else await sb.from('leave_balances').insert({employee_id:editingEmpId, leave_type_id:ty.id, balance:v});
  }
  // تسوية أرصدة الإجازات المرتبطة بالجنس: إضافة ما يلزم، وإزالة ما لم يعد ينطبق
  const newGender = payload.gender;
  for(const ty of (allTypes||[])){
    if(!ty.gender_specific) continue;
    const hasBalance = !!bmap[ty.id];
    if(ty.gender_specific === newGender){
      if(!hasBalance) await sb.from('leave_balances').insert({employee_id:editingEmpId, leave_type_id:ty.id, balance:Number(ty.fixed_annual)||0});
    } else if(hasBalance){
      await sb.from('leave_balances').delete().eq('id', bmap[ty.id].id);
    }
  }
  msg.className='msg ok';
  if(vErr){
    msg.textContent = (lang==='en'?'Saved, but could not verify: ':'تم الحفظ، لكن تعذّر التحقق: ')+vErr.message;
  } else {
    msg.textContent = (lang==='en'?'Saved. Manager email: ':'تم الحفظ. بريد المدير: ')+(verify.manager_email||(lang==='en'?'(none)':'(لا يوجد)'))+
      (lang==='en'?' — Phone: ':' — الهاتف: ')+(verify.manager_phone||(lang==='en'?'(none)':'(لا يوجد)'));
  }
  await new Promise(r=>setTimeout(r, 1800));
  if(editingEmpId === session.id){ session.name = payload.full_name; session.role = payload.role; setSession(session); return; }
  hrTab('emp');
}

let typesCache = [];
async function hrTypes(){
  const body = document.getElementById('body');
  const {data: types} = await sb.from('leave_types').select('*').order('name_ar');
  typesCache = (types || []).filter(ty=>ty.active!==false);
  const tn = x => x ? (lang==='en' ? (x.name_en || x.name_ar) : x.name_ar) : '-';
  const rows = typesCache.map(ty=>`<tr>
    <td><b>${tn(ty)}</b></td>
    <td><input type="number" step="0.5" min="0" id="ft_${ty.id}" value="${ty.fixed_annual||0}" style="width:90px"></td>
    <td><input type="number" step="0.5" min="0" id="ac_${ty.id}" value="${ty.accrual_per_month||0}" style="width:90px"></td>
    <td><input type="checkbox" id="ch_${ty.id}" ${ty.counts_holidays?'checked':''} style="width:auto"></td>
    <td><input type="checkbox" id="ul_${ty.id}" ${ty.unlimited?'checked':''} style="width:auto"></td></tr>`).join('');
  body.innerHTML = `<div class="card accent-gold">
    <h2 style="font-size:1rem">${t('tab_types')}</h2>
    <p style="font-size:.82rem;opacity:.75;margin:0 0 10px">${lang==='en'
      ? 'The fixed annual balance is granted to a new employee when added. Monthly accrual is added to balance automatically. "No limit" means every approved request is granted without ever reducing a balance (e.g. bereavement leave with no cap on occurrences).'
      : 'الرصيد السنوي الثابت يُمنح للموظف الجديد عند إضافته. التراكم الشهري يُضاف تلقائياً لرصيد الموظف. خيار "بدون حد" يعني أن كل طلب معتمد من هذا النوع يُمنح دون خصم من أي رصيد (مثل إجازة الوفاة التي لا حد لعدد مرّاتها).'}</p>
    <table><tr><th>${t('type_col')}</th><th>${lang==='en'?'Fixed Balance (days)':'الرصيد الثابت (يوم)'}</th><th>${lang==='en'?'Monthly Accrual (days)':'التراكم الشهري (يوم)'}</th><th>${lang==='en'?'Holidays count within':'تُحتسب العطل ضمنها'}</th><th>${lang==='en'?'No limit':'بدون حد'}</th></tr>${rows}</table>
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input type="checkbox" id="apply_all" style="width:auto">
      ${lang==='en'?'Apply the fixed-balance difference to all current employees\' balances':'تطبيق فرق الرصيد الثابت على أرصدة جميع الموظفين الحاليين'}</label>
    <button onclick="saveTypes()">${t('save')}</button>
    <div id="ty_msg" class="msg"></div>
  </div>`;
}
async function saveTypes(){
  const msg = document.getElementById('ty_msg'); msg.className='msg'; msg.textContent = lang==='en'?'Saving...':'جاري الحفظ...';
  const applyAll = document.getElementById('apply_all').checked;
  try{
    for(const ty of typesCache){
      const nf = Number(document.getElementById('ft_'+ty.id).value)||0;
      const na = Number(document.getElementById('ac_'+ty.id).value)||0;
      const nc = document.getElementById('ch_'+ty.id).checked;
      const nu = document.getElementById('ul_'+ty.id).checked;
      const {error} = await sb.from('leave_types').update({fixed_annual:nf, accrual_per_month:na, counts_holidays:nc, unlimited:nu}).eq('id',ty.id);
      if(error) throw error;
      const diff = nf - Number(ty.fixed_annual||0);
      if(applyAll && diff !== 0){
        const {data: bals} = await sb.from('leave_balances').select('*').eq('leave_type_id',ty.id);
        await Promise.all((bals||[]).map(b=>sb.from('leave_balances').update({balance:Number(b.balance)+diff, updated_at:new Date().toISOString()}).eq('id',b.id)));
      }
    }
    msg.className='msg ok'; msg.textContent = lang==='en'?'Saved':'تم الحفظ';
    hrTypes();
  }catch(e){ msg.className='msg err'; msg.textContent=(lang==='en'?'Error: ':'خطأ: ')+(e.message||e); }
}

async function hrAddForm(){
  const body = document.getElementById('body');
  const {data: emps} = await sb.from('employees').select('id, full_name').eq('status','active');
  let mgrOptions = `<option value="">${t('none_opt')}</option>` + (emps||[]).map(e=>`<option value="${e.id}">${esc(e.full_name)}</option>`).join('');
  body.innerHTML = `<div class="card">
    <h2 style="font-size:1rem">${t('add_new_emp')}</h2>
    <label>${t('emp_code')}</label><input id="a_code">
    <label>${t('full_name')}</label><input id="a_name">
    <label>${lang==='en'?'Employee Email':'البريد الإلكتروني للموظف'} (${lang==='en'?'optional':'اختياري'})</label><input id="a_email" type="email">
    <label>${t('pin')} (${t('four_digits')})</label><input id="a_pin" maxlength="4">
    <label>${t('role_label')}</label><select id="a_role"><option value="employee">${t('role_employee')}</option><option value="manager">${t('role_manager')}</option><option value="hr">${t('role_hr')}</option><option value="admin">${t('role_admin')}</option></select>
    <label>${t('job_title')}</label><input id="a_title">
    <label>${t('department')}</label><input id="a_dept">
    <label>${lang==='en'?'Gender':'الجنس'}</label>
    <select id="a_gender">
      <option value="" selected>${lang==='en'?'Unspecified':'غير محدد'}</option>
      <option value="male">${lang==='en'?'Male':'ذكر'}</option>
      <option value="female">${lang==='en'?'Female':'أنثى'}</option>
    </select>
    <label>${t('manager_select')}</label><select id="a_mgr">${mgrOptions}</select>
    <label>${t('manager_text')}</label><input id="a_mgrname">
    <label>${t('manager_email')}</label><input id="a_mgremail" type="email" placeholder="manager@example.com">
    <label>${t('manager_phone')}</label><input id="a_mgrphone" dir="ltr" placeholder="9647701234567">
    <label>${t('service_start')}</label><input id="a_hire" type="date">
    <button onclick="addEmployee()">${t('add')}</button>
    <div id="a_msg" class="msg"></div>
  </div>`;
}
async function addEmployee(){
  const msg = document.getElementById('a_msg');
  const payload = {
    emp_code: document.getElementById('a_code').value.trim(),
    full_name: document.getElementById('a_name').value.trim(),
    pin: normDigits(document.getElementById('a_pin').value.trim()),
    role: document.getElementById('a_role').value,
    department: document.getElementById('a_dept').value.trim(),
    manager_id: document.getElementById('a_mgr').value || null,
    hire_date: document.getElementById('a_hire').value,
    job_title: document.getElementById('a_title').value.trim(),
    last_accrual: new Date().toISOString().slice(0,10),
    manager_name: document.getElementById('a_mgrname').value.trim() || null,
    manager_email: document.getElementById('a_mgremail').value.trim() || null,
    manager_phone: document.getElementById('a_mgrphone').value.trim() || null,
    email: document.getElementById('a_email').value.trim() || null,
    gender: document.getElementById('a_gender').value || null,
    status: 'active'
  };
  if(!payload.emp_code || !payload.full_name || payload.pin.length!==4 || !payload.hire_date){
    msg.textContent = lang==='en' ? 'Fill all required fields (PIN must be 4 digits)' : 'أكمل جميع الحقول (الرمز 4 أرقام)'; msg.className='msg err'; return;
  }
  const {data: emp, error} = await sb.from('employees').insert(payload).select().single();
  if(error){ msg.textContent = (lang==='en'?'Error: ':'خطأ: ')+error.message; msg.className='msg err'; return; }

  const {data: allTypes} = await sb.from('leave_types').select('*');
  const applicable = (allTypes||[]).filter(ty=>ty.active!==false && (!ty.gender_specific || ty.gender_specific===payload.gender));
  const rows = applicable.map(ty=>({employee_id: emp.id, leave_type_id: ty.id, balance: Number(ty.fixed_annual)||0}));
  await sb.from('leave_balances').insert(rows);

  msg.textContent = lang==='en' ? 'Added successfully' : 'تمت الإضافة بنجاح'; msg.className='msg ok';
  setTimeout(()=>hrTab('emp'), 700);
}

render();
</script>
